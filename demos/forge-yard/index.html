<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c22"><title>Forge Yard | Wildshard Combat Prototype</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#192a30;color:#eeeadf;--blue:#83e2d3;--gold:#f6aa65}
*{box-sizing:border-box}body{margin:0;overflow:hidden}.yard{position:fixed;inset:0;touch-action:none}.yard canvas{position:absolute;inset:0;width:100%;height:100%}
header{position:absolute;inset:0 0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#10191df0,#10191d00);pointer-events:none}
.tag{color:var(--blue);font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;font-weight:800}
h1{margin:2px 0 7px;font-size:1.9rem;letter-spacing:-.055em;line-height:1.05}h1 span{color:#c4a17f}
meter{width:126px;max-width:35vw;height:14px;accent-color:var(--blue)}.hud{display:flex;justify-content:space-between;gap:12px;font-size:.72rem}.hud strong{display:block;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}.hud .opponent{text-align:right}.opponent meter{accent-color:#f39870}.opponent meter::-webkit-meter-optimum-value{background:#f39870}#hero::-webkit-meter-optimum-value{background:#83e2d3}
#notice{position:absolute;top:119px;left:50%;transform:translateX(-50%);margin:0;background:#142127dd;color:#fff1cf;padding:6px 12px;border-radius:3px;font-size:.73rem;font-weight:700;white-space:nowrap;pointer-events:none}
#tide{position:absolute;top:156px;left:50%;transform:translateX(-50%);margin:0;padding:5px 9px;border:1px solid #66b8c2;background:#102b34e8;color:#cffff4;font-size:.68rem;font-weight:750;letter-spacing:.025em;white-space:nowrap;pointer-events:none}
button,select{font:inherit;color:#edf2e7;background:#17292fe8;border:1px solid #739491;border-radius:4px;min-height:44px}button{touch-action:none}button:focus-visible,select:focus-visible{outline:2px solid var(--blue)}button:disabled{opacity:.45}
.toolbar{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:12px;right:12px;display:grid;gap:6px;grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.toolbar select{min-width:0;padding:0 7px}.encounter-tools{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}.toolbar button{padding:0 9px;font-size:.79rem}
.stick{position:absolute;bottom:126px;left:16px;width:113px;height:113px;border:1px solid #c1d6cb8b;border-radius:50%;background:#202b34a8;touch-action:none;display:grid;place-items:center}.knob{pointer-events:none;width:55px;height:55px;border:1px solid #cdd9c8a5;background:#c1d6cb47;border-radius:50%}
.actions{position:absolute;right:16px;bottom:128px;display:grid;grid-template-columns:52px 78px;align-items:end;gap:9px}.actions button{border-radius:50%;font-size:.70rem;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.actions button:first-child{width:52px;height:52px}.actions button:last-child{width:78px;height:78px;border-color:#e4c29b;color:#fff4d8;background:#a15820c9}
.sub{position:absolute;bottom:111px;color:#d0cbbd;left:14px;font-size:.63rem;pointer-events:none}.win{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);text-align:center;width:min(84vw,310px);background:#111f25ee;border:1px solid #b38f6d;padding:16px;border-radius:6px}.win strong{display:block;font-size:1.35rem}.win p{margin:.25em 0 1em;font-size:.8rem}.win button{padding:6px 14px}
#trial-link{position:absolute;right:16px;top:max(15px,env(safe-area-inset-top));color:#cfe7d3;font-size:.68rem;font-weight:750;text-underline-offset:.22em;pointer-events:auto;padding:7px 0}
#shift-board{display:flex;align-items:center;gap:8px;position:absolute;left:50%;top:100px;transform:translateX(-50%);white-space:nowrap;pointer-events:none;font-size:.63rem;letter-spacing:.10em;background:#111f25e8;border:1px solid #9a7955;padding:6px 10px;color:#fee0aa}
#shift-board b{color:#f4b774}#shift-board span{color:#dfd2b8}
[data-trial] #notice{top:133px}[data-trial] #tide{top:169px}[data-trial] .toolbar{grid-template-columns:minmax(0,1fr) auto}
@media(min-width:720px){#trial-link{right:28px;top:22px}#shift-board{top:102px}}
[hidden]{display:none!important}@media(min-width:720px){header{padding:20px 28px}.toolbar{left:auto;right:24px;width:480px}.sub{left:24px}}
</style></head><body><main class="yard" id="yard">
<header><div class="tag">Wildshard / combat study</div><a id="trial-link" href="?trial=double-shift">Double Shift</a><h1 id="arena-name">Forge <span>Yard</span></h1>
<div class="hud"><div><strong>Walker</strong><meter id="hero" max="120" value="120" aria-label="Player health"></meter> <span id="hero-hp">120</span></div><div class="opponent"><strong id="enemy-name">Loading</strong><meter id="enemy" max="100" value="100" aria-label="Enemy health"></meter> <span id="enemy-hp">—</span></div></div></header>
<div id="shift-board" aria-label="Trial progress" hidden><b id="bout"></b><span id="bench"></span></div>
<p id="notice" role="status">Loading the forge…</p>
<p id="tide" aria-live="polite" hidden></p>
<div class="stick" id="stick" aria-label="Drag left stick to move"><div class="knob" id="knob"></div></div>
<div class="actions"><button id="dodge">Dodge</button><button id="attack">Cut</button></div>
<p class="sub">Drag to move · WASD / Space / Shift</p>
<div class="toolbar"><select id="weapon" aria-label="Weapon"></select><button id="next">Next rival</button><button id="reset">Restart</button><div class="encounter-tools"><select id="rival" aria-label="Rival"></select><select id="variant" aria-label="Enemy variant"></select></div></div>
<section id="win" class="win" hidden><strong id="win-title"></strong><p id="win-body"></p><button id="win-next">Next rival</button></section>
</main><script type="module" src="dist/yard.js"></script></body></html>
